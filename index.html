<html lang="hi">
<head>

  <title>3D Math Quiz Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, #090d16 75%);
      color: #f8fafc;
      padding: 20px;
      perspective: 1000px;
      overflow: hidden;
    }

    /* 3D Motion & Rotating Neon Lighting Container */
    .card-wrapper {
      position: relative;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 3px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.25);
    }

    /* Moving 3D Lighting Border */
    .card-wrapper::before {
      content: "";
      position: absolute;
      inset: -50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        #38bdf8 90deg,
        #a855f7 180deg,
        #22c55e 270deg,
        transparent 360deg
      );
      animation: spinLight 4s linear infinite;
      z-index: 0;
    }

    @keyframes spinLight {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .game-card {
      position: relative;
      z-index: 1;
      background: linear-gradient(145deg, #172033, #0f172a);
      border-radius: 18px;
      padding: 26px;
      text-align: center;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.12);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .sound-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      cursor: pointer;
    }

    .sound-btn:hover {
      background: #0284c7;
      color: #ffffff;
    }

    h1 {
      margin: 4px 0 6px;
      font-size: 26px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.45);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 14px;
      color: #94a3b8;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #1e293b;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .question-box {
      font-size: 36px;
      font-weight: 700;
      margin: 16px 0;
      padding: 20px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 12px;
      letter-spacing: 1px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 18px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #090d16;
      color: #f8fafc;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    button[type="submit"],
    .restart-btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, #0284c7, #2563eb);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.4);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button[type="submit"]:hover,
    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.55);
    }

    .feedback {
      min-height: 24px;
      margin-top: 14px;
      font-size: 15px;
      font-weight: 600;
    }

    .correct {
      color: #4ade80;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    }

    .wrong {
      color: #f87171;
      text-shadow: 0 0 10px rgba(248, 113, 113, 0.4);
    }

    .restart-btn {
      margin-top: 16px;
      background: linear-gradient(90deg, #16a34a, #059669);
    }
  </style>
</head>
<body>
  <div class="card-wrapper" id="card-wrapper">
    <div class="game-card">
      <div class="top-bar">
        <span style="font-size: 12px; color: #64748b;">3D EDITION</span>
        <button type="button" id="sound-btn" class="sound-btn">Sound: ON</button>
      </div>

      <h1>2D Math Quiz Game</h1>
      <p class="subtitle">5 sawaalon ke sahi jawaab dein</p>

      <div class="stats">
        <span id="question-counter">Sawaal: 1 / 5</span>
        <span id="score-counter">Score: 0</span>
      </div>

      <div id="question-box" class="question-box">...</div>

      <form id="answer-form">
        <input
          type="number"
          id="answer-input"
          placeholder="Apna jawaab likhein"
          required
          autocomplete="off"
        />
        <button type="submit" id="submit-btn">Submit</button>
      </form>

      <div id="feedback" class="feedback"></div>
      <button type="button" id="restart-btn" class="restart-btn" style="display: none;">
        Dobara Khelein
      </button>
    </div>
  </div>

  <script>
    const totalQuestions = 5;
    const operators = ["+", "-", "*"];

    let currentQuestion = 1;
    let score = 0;
    let correctAnswer = 0;
    let gameOver = false;
    let soundEnabled = true;

    const cardWrapperEl = document.getElementById("card-wrapper");
    const soundBtnEl = document.getElementById("sound-btn");
    const questionCounterEl = document.getElementById("question-counter");
    const scoreCounterEl = document.getElementById("score-counter");
    const questionBoxEl = document.getElementById("question-box");
    const answerFormEl = document.getElementById("answer-form");
    const answerInputEl = document.getElementById("answer-input");
    const submitBtnEl = document.getElementById("submit-btn");
    const feedbackEl = document.getElementById("feedback");
    const restartBtnEl = document.getElementById("restart-btn");

    // 3D Tilt Motion on Mouse Move
    document.addEventListener("mousemove", (e) => {
      const xAxis = (window.innerWidth / 2 - e.pageX) / 28;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 28;
      cardWrapperEl.style.transform = `rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener("mouseleave", () => {
      cardWrapperEl.style.transform = "rotateY(0deg) rotateX(0deg)";
    });

    // Built-in Soft Background Music (Web Audio API - no external mp3 needed)
    let audioCtx = null;
    let bgInterval = null;
    const notes = [261.63, 329.63, 392.0, 523.25, 392.0, 329.63];
    let noteIndex = 0;

    function startBackgroundMusic() {
      if (!soundEnabled) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      if (bgInterval) return;

      bgInterval = setInterval(() => {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = notes[noteIndex % notes.length];
        noteIndex++;

        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.45);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.45);
      }, 500);
    }

    function stopBackgroundMusic() {
      if (bgInterval) {
        clearInterval(bgInterval);
        bgInterval = null;
      }
    }

    // Voice Command (Speech Synthesis)
    function speakMessage(text) {
      if (!soundEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = 1;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    soundBtnEl.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      soundBtnEl.textContent = soundEnabled ? "Sound: ON" : "Sound: OFF";
      if (soundEnabled) {
        startBackgroundMusic();
      } else {
        stopBackgroundMusic();
        window.speechSynthesis.cancel();
      }
    });

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      const num1 = randomInt(1, 15);
      const num2 = randomInt(1, 15);
      const op = operators[randomInt(0, operators.length - 1)];

      if (op === "+") correctAnswer = num1 + num2;
      else if (op === "-") correctAnswer = num1 - num2;
      else correctAnswer = num1 * num2;

      questionCounterEl.textContent = `Sawaal: ${currentQuestion} / ${totalQuestions}`;
      questionBoxEl.textContent = `${num1} ${op} ${num2} = ?`;
      answerInputEl.value = "";
      answerInputEl.focus();
    }

    function finishGame() {
      gameOver = true;
      questionBoxEl.textContent = `Final Score: ${score} / ${totalQuestions}`;
      answerInputEl.style.display = "none";
      submitBtnEl.style.display = "none";
      restartBtnEl.style.display = "block";
      speakMessage(`Game over. Your final score is ${score} out of ${totalQuestions}`);
    }

    answerFormEl.addEventListener("submit", function (event) {
      event.preventDefault();
      if (gameOver) return;

      startBackgroundMusic();

      const userAnswer = parseInt(answerInputEl.value, 10);
      if (Number.isNaN(userAnswer)) return;

      if (userAnswer === correctAnswer) {
        score++;
        scoreCounterEl.textContent = `Score: ${score}`;
        feedbackEl.textContent = "Sahi jawaab!";
        feedbackEl.className = "feedback correct";
        speakMessage("Your answer is correct");
      } else {
        feedbackEl.textContent = `Galat! Sahi jawaab ${correctAnswer} hai.`;
        feedbackEl.className = "feedback wrong";
        speakMessage(`Wrong answer. The correct answer is ${correctAnswer}`);
      }

      currentQuestion++;
      if (currentQuestion <= totalQuestions) {
        generateQuestion();
      } else {
        finishGame();
      }
    });

    restartBtnEl.addEventListener("click", function () {
      startBackgroundMusic();
      currentQuestion = 1;
      score = 0;
      gameOver = false;
      scoreCounterEl.textContent = "Score: 0";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      answerInputEl.style.display = "block";
      submitBtnEl.style.display = "block";
      restartBtnEl.style.display = "none";
      generateQuestion();
    });

    generateQuestion();
  </script>
</body>
</html>
